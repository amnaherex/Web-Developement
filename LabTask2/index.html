
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 - Responsive Navbar and Grid</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- NAVBAR -->
    <header class="bg-black text-white">

        <input type="checkbox" id="menu" class="peer hidden">

        <div class="flex items-center justify-between p-4">

            <!-- Logo -->
            <a href="#" class="w-32">
                <img src="images/ascolour_001.svg" alt="AS Colour logo" class="h-6">
            </a>

            <!-- Desktop Menu -->
            <nav class="hidden md:flex gap-6">
                <a href="#" class="hover:text-yellow-400">Men</a>
                <a href="#" class="hover:text-yellow-400">Women</a>
                <a href="#" class="hover:text-yellow-400">Kids</a>
                <a href="#" class="hover:text-yellow-400">Headwear</a>
                <a href="#" class="hover:text-yellow-400">About</a>
            </nav>

            <!-- Cart and Hamburger -->
            <div class="flex items-center justify-end gap-4 w-32">
                <a href="#" class="text-2xl">🛒</a>

                <label for="menu" class="text-3xl cursor-pointer md:hidden">☰</label>
            </div>
        </div>

        <!-- Mobile Menu -->
        <nav class="hidden peer-checked:block md:hidden">
            <a href="#" class="block p-4 border-t border-gray-700">Men</a>
            <a href="#" class="block p-4 border-t border-gray-700">Women</a>
            <a href="#" class="block p-4 border-t border-gray-700">Kids</a>
            <a href="#" class="block p-4 border-t border-gray-700">Headwear</a>
            <a href="#" class="block p-4 border-t border-gray-700">About</a>
        </nav>
    </header>

    <!-- PRODUCT GRID -->
    <main class="p-6">
        <h1 class="text-3xl font-bold mb-6">New Arrivals</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

            <!-- Product 1 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_030.jpg" alt="Organic Tank" class="w-full h-64 object-contain">
                <h2 class="font-bold mt-4">Organic Tank</h2>
                <p class="text-gray-600">$28.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_031.webp" alt="Rugby Stripe" class="w-full h-64 object-contain">
                <h2 class="font-bold mt-4">Rugby Stripe</h2>
                <p class="text-gray-600">$55.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_032.webp" alt="Classic Tee" class="w-full h-64 object-contain">
                <h2 class="font-bold mt-4">Classic Tee</h2>
                <p class="text-gray-600">$32.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_033.webp" alt="Trucker Cap" class="w-full h-64 object-contain">
                <h2 class="font-bold mt-4">Trucker Cap</h2>
                <p class="text-gray-600">$20.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

            <!-- Product 5 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_012.jpg" alt="Cuff Beanie" class="w-full h-64 object-cover">
                <h2 class="font-bold mt-4">Cuff Beanie</h2>
                <p class="text-gray-600">$18.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

            <!-- Product 6 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_006.jpg" alt="Half Zip Crew" class="w-full h-64 object-cover">
                <h2 class="font-bold mt-4">Half Zip Crew</h2>
                <p class="text-gray-600">$62.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

            <!-- Product 7 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_004.jpg" alt="Relax Hood" class="w-full h-64 object-cover">
                <h2 class="font-bold mt-4">Relax Hood</h2>
                <p class="text-gray-600">$58.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

            <!-- Product 8 -->
            <div class="bg-white p-4">
                <img src="images/ascolour_003.jpg" alt="Work Jacket" class="w-full h-64 object-cover">
                <h2 class="font-bold mt-4">Work Jacket</h2>
                <p class="text-gray-600">$85.00</p>
                <button class="bg-black text-white w-full py-2 mt-4">Add to Cart</button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white text-center p-6">
        &copy; 2026 AS Colour - Lab 2
    </footer>

</body>
</html>
